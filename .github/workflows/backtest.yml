name: Run Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2026-04-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-08-31'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtester/backtest.py --start ${{ inputs.start_date }} --end ${{ inputs.end_date }}

      - name: Evaluate backtest accuracy
        run: python backtester/evaluate.py backtester/data/backtest_results.json

      - name: Commit and push backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtester/data/backtest_results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add backtest results"
          git push
