<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRFI Board</title>
<style>
  @font-face {
    font-family: 'Georgia';
  }

  :root {
    --paper: #FAF6ED;
    --paper-card: #FFFFFF;
    --ink: #1A1613;
    --ink-soft: rgba(26,22,19,0.58);
    --border: #E8DFC8;
    --gold: #C9932E;
    --gold-soft: rgba(201,147,46,0.14);
    --sage: #5E7F63;
    --sage-bg: rgba(94,127,99,0.14);
    --ochre: #B98A3D;
    --ochre-bg: rgba(185,138,61,0.16);
    --clay: #B5604A;
    --clay-bg: rgba(181,96,74,0.14);
    --shadow: 0 1px 2px rgba(26,22,19,0.04), 0 8px 24px rgba(26,22,19,0.06);
  }

  html[data-theme="dark"] {
    --paper: #14141C;
    --paper-card: #1D1D28;
    --ink: #EDEAE0;
    --ink-soft: rgba(237,234,224,0.56);
    --border: #2E2E3C;
    --gold: #E0AC4C;
    --gold-soft: rgba(224,172,76,0.14);
    --sage: #7FA986;
    --sage-bg: rgba(127,169,134,0.16);
    --ochre: #D9A85C;
    --ochre-bg: rgba(217,168,92,0.16);
    --clay: #D07E67;
    --clay-bg: rgba(208,126,103,0.16);
    --shadow: none;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .display {
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  }

  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.75rem 1.5rem 1.5rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }

  .title-block h1 {
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    margin: 0;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .title-block p {
    margin: 0.4rem 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .theme-toggle button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    width: 34px;
    height: 34px;
    border-radius: 999px;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .theme-toggle button.active {
    background: var(--gold-soft);
    color: var(--gold);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0.5rem 1.5rem 4rem;
  }

  .game-card {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 1.35rem 1.5rem;
    margin-bottom: 1rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: center;
  }

  .matchup-teams {
    font-size: 1.15rem;
    line-height: 1.5;
  }

  .matchup-teams .at {
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-transform: lowercase;
    margin: 0 0.35rem;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.55rem;
  }

  .tier-pill {
    font-size: 0.7rem;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.2rem 0.65rem;
  }

  .confidence-pill {
    font-size: 0.7rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 0.2rem 0.65rem;
  }

  .confidence-high { background: var(--sage-bg); color: var(--sage); }
  .confidence-medium { background: var(--ochre-bg); color: var(--ochre); }
  .confidence-low { background: var(--clay-bg); color: var(--clay); }

  .prob-badge {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--gold-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .prob-badge .num {
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 1.65rem;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
  }

  .prob-badge .label {
    font-size: 0.6rem;
    color: var(--gold);
    opacity: 0.75;
    margin-top: 0.15rem;
    letter-spacing: 0.02em;
  }

  .empty-state {
    text-align: center;
    padding: 4rem 1.5rem;
    color: var(--ink-soft);
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  .empty-state p {
    margin: 0;
    font-size: 0.95rem;
  }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1.5rem 2rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  @media (max-width: 520px) {
    .game-card { grid-template-columns: 1fr auto; padding: 1.15rem; }
    .matchup-teams { font-size: 1.02rem; }
    .prob-badge { width: 68px; height: 68px; }
    .prob-badge .num { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1 class="display">NRFI Board</h1>
    <p id="generated-at">Loading today's games…</p>
  </div>
  <div class="theme-toggle" id="theme-toggle">
    <button id="btn-light" aria-label="Light mode">☀</button>
    <button id="btn-dark" aria-label="Dark mode">☾</button>
  </div>
</header>

<main id="games-container">
  <div class="empty-state"><p>Fetching predictions…</p></div>
</main>

<footer>
  Predicts the probability neither team scores in the 1st inning.
</footer>

<script>
function setTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  localStorage.setItem('nrfi-theme', mode);
  document.getElementById('btn-light').classList.toggle('active', mode === 'light');
  document.getElementById('btn-dark').classList.toggle('active', mode === 'dark');
}

const savedTheme = localStorage.getItem('nrfi-theme')
  || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setTheme(savedTheme);

document.getElementById('btn-light').addEventListener('click', () => setTheme('light'));
document.getElementById('btn-dark').addEventListener('click', () => setTheme('dark'));

async function loadPredictions() {
  const container = document.getElementById('games-container');
  const genLabel = document.getElementById('generated-at');

  try {
    const res = await fetch('predictions.json?_=' + Date.now());
    if (!res.ok) throw new Error('No predictions file yet');
    const data = await res.json();

    const generated = new Date(data.generated_at);
    genLabel.textContent = 'Updated ' + generated.toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });

    if (!data.games || data.games.length === 0) {
      container.innerHTML = '<div class="empty-state"><p>No games scheduled today.</p></div>';
      return;
    }

    container.innerHTML = data.games.map(renderGame).join('');
  } catch (err) {
    container.innerHTML = '<div class="empty-state"><p>Predictions haven\'t run yet today.</p></div>';
    genLabel.textContent = '';
  }
}

function renderGame(game) {
  const pct = Math.round(game.nrfi_probability * 100);
  const confClass = 'confidence-' + game.confidence;

  return `
    <div class="game-card">
      <div>
        <div class="matchup-teams">
          ${escapeHtml(game.away_team)}<span class="at">at</span>${escapeHtml(game.home_team)}
        </div>
        <div class="card-meta">
          <span class="tier-pill">${game.tier === 'confirmed' ? 'Confirmed lineups' : 'Projected lineups'}</span>
          <span class="confidence-pill ${confClass}">${game.confidence} confidence</span>
        </div>
      </div>
      <div class="prob-badge">
        <div class="num">${pct}%</div>
        <div class="label">NRFI</div>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadPredictions();
</script>

</body>
</html>
